image: node:20

stages:
  - install
  - validate
  - build

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/node_modules/
    - web-astro/node_modules/

install_backend:
  stage: install
  script:
    - cd backend
    - npm ci

validate_backend:
  stage: validate
  script:
    - cd backend
    - npm run lint || echo "Lint no configurado"
    - npm run typecheck || echo "Typecheck no configurado"

build_web:
  stage: build
  script:
    - cd web-astro
    - npm ci
    - npm run build