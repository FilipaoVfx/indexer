# Orquestador de pipelines CI/CD
variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_PREFER_OFFLINE: "true"

default:
  interruptible: true
  before_script:
    - node --version
    - npm --version

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
  policy: pull-push

stages:
  - install # Etapa CI
  - validate # Etapa CI
  - build # Etapa CD
  - deploy # Etapa CD

# Ejecución de pipelines CI/CD
include:
  - local: '/.ci-jobs.yml'
  - local: '/.cd-jobs.yml'