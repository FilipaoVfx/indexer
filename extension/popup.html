<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Indexer</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: #f6f8fc;
        min-width: 340px;
        color: #0f172a;
      }
      main { padding: 14px; }
      h1 { margin: 0 0 2px; font-size: 15px; }
      .sub { margin: 0 0 12px; font-size: 11px; color: #64748b; }

      .field { margin-bottom: 8px; }
      label { display: block; font-size: 10px; margin-bottom: 3px; color: #475569; text-transform: uppercase; letter-spacing: 0.04em; }
      input {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px;
        font-size: 12px;
      }

      button { border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.55; cursor: default; }

      #scrapeButton {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
        font-size: 13px;
        background: #111827;
        color: #ffffff;
      }

      .secondary-row { display: flex; gap: 8px; margin-top: 8px; }
      .range-row { display: flex; gap: 8px; margin-top: 10px; }
      .range-row .field { flex: 1; margin-bottom: 0; }
      .secondary-row button {
        flex: 1;
        padding: 7px;
        font-size: 11px;
        background: #e5e7eb;
        color: #111827;
      }
      #saveButton { background: #dbeafe; color: #1e3a8a; }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin: 12px 0 0;
      }
      .stat {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 6px 4px;
        background: #ffffff;
        text-align: center;
      }
      .stat span { display: block; color: #64748b; font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em; }
      .stat strong { display: block; color: #0f172a; font-size: 16px; margin-top: 2px; }

      #scannerStatus { margin: 10px 0 0; font-size: 11px; color: #475569; min-height: 14px; }

      #log {
        margin: 10px 0 0;
        border: 1px solid #dbe1ea;
        border-radius: 8px;
        background: #ffffff;
        min-height: 90px;
        max-height: 180px;
        overflow: auto;
        font-size: 10.5px;
        line-height: 1.4;
        padding: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>X Bookmarks Indexer</h1>
      <p class="sub">Auto-sync activo: al guardar un post en X se envía solo. Usa el botón para importar los bookmarks ya existentes.</p>

      <div class="field">
        <label for="apiBaseUrl">Backend URL</label>
        <input id="apiBaseUrl" placeholder="https://indexer-hzto.onrender.com" />
      </div>
      <div class="field">
        <label for="userId">User ID</label>
        <input id="userId" placeholder="local-user" />
      </div>

      <div class="secondary-row">
        <button id="saveButton">Guardar ajustes</button>
      </div>

      <div class="range-row">
        <div class="field">
          <label for="rangeMin">Desde #</label>
          <input id="rangeMin" type="number" min="1" step="1" placeholder="1" />
        </div>
        <div class="field">
          <label for="rangeMax">Hasta # (vacío = todos)</label>
          <input id="rangeMax" type="number" min="1" step="1" placeholder="∞" />
        </div>
      </div>

      <button id="scrapeButton">⬇ Importar bookmarks</button>
      <p id="scannerStatus">Abre x.com/i/bookmarks y pulsa importar.</p>

      <div class="stats">
        <div class="stat"><span>Escaneados</span><strong id="scannerScanned">0</strong></div>
        <div class="stat"><span>Guardados</span><strong id="scannerSaved">0</strong></div>
        <div class="stat"><span>Nuevos</span><strong id="scannerPending">0</strong></div>
        <div class="stat"><span>Errores</span><strong id="scannerErrors">0</strong></div>
      </div>

      <div class="secondary-row">
        <button id="scannerClearButton">Reiniciar cola</button>
        <button id="clearActivityButton">Limpiar log</button>
      </div>

      <pre id="log"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
