name: Keepalive Render

# Render free duerme tras ~15 min sin tráfico. El cron */10 de GitHub se
# throttlea en la práctica a 60-120 min (medido), así que un ping por run no
# alcanza: cada run mantiene un LOOP de pings cada 4 min durante ~2h50m, y el
# schedule cada 2h lanza el siguiente con solape. Repos públicos: minutos gratis.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Ping /health every 4 min for ~2h50m
        run: |
          end=$((SECONDS + 170*60))
          while [ $SECONDS -lt $end ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://indexer-hzto.onrender.com/health || echo "000")
            echo "$(date -u +%H:%M:%S) health -> HTTP $code"
            sleep 240
          done
