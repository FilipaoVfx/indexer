name: Sync to GitLab

# Required GitHub secret: GITLAB_TOKEN with write_repository permission.
# Optional: GITLAB_USERNAME if the token requires a specific username, or
# GITLAB_REPOSITORY_URL if you prefer storing the authenticated URL directly.

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Push to GitLab and trigger pipeline
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.event.deleted == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push current ref to GitLab
        env:
          GITLAB_REPOSITORY: gitlab.com/juanku2003/indexer.git
          GITLAB_REPOSITORY_URL: ${{ secrets.GITLAB_REPOSITORY_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${GITLAB_REPOSITORY_URL}" ]; then
            remote_url="${GITLAB_REPOSITORY_URL}"
          else
            if [ -z "${GITLAB_TOKEN}" ]; then
              echo "::error::Define GITLAB_TOKEN or GITLAB_REPOSITORY_URL in GitHub Actions secrets."
              exit 1
            fi

            username="${GITLAB_USERNAME:-oauth2}"
            remote_url="https://${username}:${GITLAB_TOKEN}@${GITLAB_REPOSITORY}"
          fi

          git remote add gitlab "${remote_url}"

          if [ "${SOURCE_REF_TYPE}" = "tag" ]; then
            git push gitlab "${SOURCE_REF}:refs/tags/${SOURCE_REF_NAME}"
          else
            git push gitlab "HEAD:refs/heads/${SOURCE_REF_NAME}"
          fi
