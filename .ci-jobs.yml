# CI STAGE - APP INTEGRATION.
image: node:20

stages:
  - install
  - validate

install:
  stage: install
  script:
    - npm ci
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/
      - backend/node_modules/
      - web-astro/node_modules/

validate_backend:
  stage: validate
  needs: [install]
  script:
    - npm run --if-present lint --workspace=x-bookmarks-backend
    - npm run --if-present typecheck --workspace=x-bookmarks-backend
    - npm run --if-present test --workspace=x-bookmarks-backend
    - |
      for file in backend/src/*.js; do
        node --check "$file"
      done
    - |
      node --input-type=module - <<'NODE'
      import fs from 'node:fs';
      import path from 'node:path';

      const sqlDir = path.join(process.cwd(), 'backend', 'sql');
      const migrations = fs
        .readdirSync(sqlDir)
        .filter((file) => file.endsWith('.sql'))
        .sort();

      if (migrations.length === 0) {
        throw new Error('No SQL migrations found in backend/sql');
      }

      migrations.forEach((file, index) => {
        const expectedPrefix = `${String(index + 1).padStart(3, '0')}_`;
        const fullPath = path.join(sqlDir, file);

        if (!file.startsWith(expectedPrefix)) {
          throw new Error(`Unexpected migration order: ${file}; expected prefix ${expectedPrefix}`);
        }

        if (fs.statSync(fullPath).size === 0) {
          throw new Error(`Empty SQL migration: ${file}`);
        }
      });
      NODE

validate_extension:
  stage: validate
  needs: [] ##
  script:
    - |
      for file in extension/*.js; do
        node --check "$file"
      done
    - |
      node --input-type=module - <<'NODE'
      import fs from 'node:fs';
      import path from 'node:path';

      const extensionDir = path.join(process.cwd(), 'extension');
      const manifestPath = path.join(extensionDir, 'manifest.json');
      const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

      const assertFile = (relativePath, label) => {
        if (!relativePath || typeof relativePath !== 'string') {
          throw new Error(`Manifest is missing ${label}`);
        }

        const fullPath = path.join(extensionDir, relativePath);
        if (!fs.existsSync(fullPath)) {
          throw new Error(`Manifest references missing file: extension/${relativePath}`);
        }
      };

      if (manifest.manifest_version !== 3) {
        throw new Error('Chrome extension must use manifest_version 3');
      }

      if (!manifest.name || !manifest.version) {
        throw new Error('Extension manifest requires name and version');
      }

      assertFile(manifest.background?.service_worker, 'background.service_worker');
      assertFile(manifest.action?.default_popup, 'action.default_popup');

      for (const contentScript of manifest.content_scripts ?? []) {
        for (const script of contentScript.js ?? []) {
          assertFile(script, 'content_scripts[].js[]');
        }
      }

      for (const resourceGroup of manifest.web_accessible_resources ?? []) {
        for (const resource of resourceGroup.resources ?? []) {
          assertFile(resource, 'web_accessible_resources[].resources[]');
        }
      }
      NODE

# --- Analisis estatico: elige UNA de las dos variantes segun donde corra SonarQube ---
#
# Variante A (self-hosted / SonarQube en tu servidor o Docker accesible en red).
# Define en GitLab (Settings > CI/CD > Variables, protegidas/enmascaradas):
#   - SONAR_HOST_URL : URL del servidor (ej. https://sonar.midominio.com)
#   - SONAR_TOKEN    : token de analisis generado en SonarQube
# Se omite si SONAR_HOST_URL no esta definido.
sonarqube-check:
  stage: validate
  needs: []
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # ubicacion del cache del scanner
    GIT_DEPTH: "0" # historico completo: necesario para deteccion de codigo nuevo
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script: [] # la imagen del scanner no trae node/npm
  script:
    - sonar-scanner
  allow_failure: true
  rules:
    - if: '$SONAR_HOST_URL == null || $SONAR_HOST_URL == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Variante B (SonarCloud, https://sonarcloud.io).
# Define en GitLab (Settings > CI/CD > Variables, protegidas/enmascaradas):
#   - SONAR_ORGANIZATION : clave de tu organizacion en SonarCloud
#   - SONAR_TOKEN        : token generado en SonarCloud (My Account > Security)
#   - SONAR_PROJECT_KEY  : (opcional) clave que SonarCloud asigna al proyecto,
#                          normalmente "<org>_<repo>". Por defecto usa la del
#                          sonar-project.properties.
# Se omite si SONAR_ORGANIZATION no esta definido.
sonarcloud-check:
  stage: validate
  needs: []
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script: []
  script:
    - sonar-scanner
        -Dsonar.host.url=https://sonarcloud.io
        -Dsonar.organization="$SONAR_ORGANIZATION"
        -Dsonar.projectKey="${SONAR_PROJECT_KEY:-x-bookmarks-indexer}"
  allow_failure: true
  rules:
    - if: '$SONAR_ORGANIZATION == null || $SONAR_ORGANIZATION == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
