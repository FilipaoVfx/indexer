build_web:
  stage: build
  image: node:20
  needs: [install]
  script:
    - npm run --if-present lint --workspace=indexbook-web
    - npm run --if-present typecheck --workspace=indexbook-web
    - npm run build --workspace=indexbook-web
  artifacts:
    expire_in: 1 week
    paths:
      - web-astro/dist/

build_backend_cr:
  stage: build_and_push_cr
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  needs: []
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script: []
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build
        -t $CI_REGISTRY_IMAGE/backend:latest
        -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
        ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA

build_frontend_cr:
  stage: build_and_push_cr
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  needs:
    - build_web
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script: []
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build
        -t $CI_REGISTRY_IMAGE/frontend:latest
        -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
        ./web-astro
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA

package_extension:
  stage: build
  needs: []
  image: mcr.microsoft.com/powershell:7.4-debian-12
  before_script: []
  script:
    - pwsh --version
    - pwsh -NoProfile -File scripts/package-extension.ps1 -OutputDir dist -OutputName x-bookmarks-extension.zip
  artifacts:
    expire_in: 1 week
    paths:
      - dist/x-bookmarks-extension.zip

pages:
  stage: deploy
  image: node:20
  needs: [build_web]
  script:
    - mv web-astro/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH