image: node:20
stages:
  - build # Etapa CD
  - build_and_push_cr
  - deploy # Etapa CD


build_web:
  stage: build
  needs: [install]
  script:
    - npm run --if-present lint --workspace=indexbook-web
    - npm run --if-present typecheck --workspace=indexbook-web
    - npm run build --workspace=indexbook-web
  artifacts:
    expire_in: 1 week
    paths:
      - web-astro/dist/

build_and_push_cr:
  stage: build
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    # Uso del Container Registry por defecto con GitLab
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  

package_extension:
  stage: build
  needs: []
  image: mcr.microsoft.com/powershell:7.4-debian-12
  before_script:
    - pwsh --version
  script:
    - pwsh -NoProfile -File scripts/package-extension.ps1 -OutputDir dist -OutputName x-bookmarks-extension.zip
  artifacts:
    expire_in: 1 week
    paths:
      - dist/x-bookmarks-extension.zip

pages:
  stage: deploy
  needs: [build_web]
  script:
    - mv web-astro/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
