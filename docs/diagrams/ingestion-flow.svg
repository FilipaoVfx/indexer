<text x="40" y="50.0" font-size="30" fill="#1e1e1e" text-anchor="start">Flujo de ingesta y sincronizacion</text>
<text x="40" y="77.0" font-size="15" fill="#495057" text-anchor="start">del guardado en X hasta que el bot/web lo encuentran — con las guardas antifragiles</text>
<text x="60" y="137.0" font-size="17" fill="#c92a2a" text-anchor="start">1 · CAPTURA (extension)</text>
<text x="220" y="191.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Guardas bookmark en X</text>
<text x="220" y="211.0" font-size="16" fill="#1e1e1e" text-anchor="middle">(auto-sync) o import por rango</text>
<text x="220" y="306.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Captura network-first:</text>
<text x="220" y="326.0" font-size="16" fill="#1e1e1e" text-anchor="middle">lee GraphQL de X (t.co ya expandido)</text>
<text x="220" y="422.8" font-size="14" fill="#1e1e1e" text-anchor="middle">Es denso? (&quot;REPOOO&quot;)</text>
<text x="220" y="440.2" font-size="14" fill="#1e1e1e" text-anchor="middle">-&gt; lookup del reply (tab, solo exitos</text>
<text x="220" y="457.8" font-size="14" fill="#1e1e1e" text-anchor="middle">se cachean; timeouts; degrada)</text>
<text x="470" y="137.0" font-size="17" fill="#e8590c" text-anchor="start">2 · BACKEND (Render)</text>
<text x="630" y="196.0" font-size="16" fill="#1e1e1e" text-anchor="middle">POST batch (x-api-key + rate limit)</text>
<text x="630" y="216.0" font-size="16" fill="#1e1e1e" text-anchor="middle">dedup por tweet_id</text>
<text x="630" y="321.0" font-size="16" fill="#1e1e1e" text-anchor="middle">upsertBatch -&gt; responde ~200ms</text>
<text x="630" y="423.6" font-size="13" fill="#1e1e1e" text-anchor="middle">Post-proceso ASYNC (setImmediate):</text>
<text x="630" y="439.9" font-size="13" fill="#1e1e1e" text-anchor="middle">t.co, links repo, seed readmes,</text>
<text x="630" y="456.1" font-size="13" fill="#1e1e1e" text-anchor="middle">goal index</text>
<text x="470" y="533.0" font-size="13" fill="#868e96" text-anchor="start">cola de entrega (MV3)</text>
<text x="630" y="584.5" font-size="12" fill="#1e1e1e" text-anchor="middle">reintentos + backoff · timeout duro</text>
<text x="630" y="599.5" font-size="12" fill="#1e1e1e" text-anchor="middle">dead-letter + chrome.alarms</text>
<text x="630" y="614.5" font-size="12" fill="#1e1e1e" text-anchor="middle">(nunca &#x27;En cola&#x27; colgado)</text>
<text x="880" y="137.0" font-size="17" fill="#2b8a3e" text-anchor="start">3 · SINCRONIZACION</text>
<text x="1030" y="191.9" font-size="15" fill="#2b8a3e" text-anchor="middle">SUPABASE</text>
<text x="1030" y="210.6" font-size="15" fill="#2b8a3e" text-anchor="middle">(fuente unica de verdad)</text>
<text x="1030" y="229.4" font-size="15" fill="#2b8a3e" text-anchor="middle">bookmarks + readmes + links</text>
<text x="1030" y="327.8" font-size="14" fill="#1e1e1e" text-anchor="middle">cron rag-ingest (6h)</text>
<text x="1030" y="345.2" font-size="14" fill="#1e1e1e" text-anchor="middle">dedup por content_hash</text>
<text x="1030" y="362.8" font-size="14" fill="#1e1e1e" text-anchor="middle">solo embebe lo nuevo</text>
<text x="1030" y="457.8" font-size="14" fill="#1864ab" text-anchor="middle">PINECONE (derivado)</text>
<text x="1030" y="475.2" font-size="14" fill="#1864ab" text-anchor="middle">vector id determinista</text>
<text x="1030" y="492.8" font-size="14" fill="#1864ab" text-anchor="middle">= idempotente</text>
<text x="1030" y="591.2" font-size="15" fill="#1e1e1e" text-anchor="middle">Bot (semantica) + Web (SQL)</text>
<text x="1030" y="610.0" font-size="15" fill="#1e1e1e" text-anchor="middle">consultan</text>
