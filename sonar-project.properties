# Configuracion del analisis SonarQube para el monorepo x-bookmarks-indexer.
# El scanner busca este archivo en la raiz del repo.

sonar.projectKey=x-bookmarks-indexer
sonar.projectName=X Bookmarks Indexer
sonar.projectVersion=0.1.0

# Analiza todo el repo y excluye lo que no es codigo fuente nuestro.
sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.astro/**,\
  **/.git/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/package-lock.json,\
  **/*.zip,\
  web-astro/public/**,\
  sonarqube/**,\
  .scannerwork/**

# No hay tests ni cobertura configurados todavia. Cuando los agregues:
# sonar.tests=backend/test,web-astro/test
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- SonarCloud ---
# Si analizas con SonarCloud (https://sonarcloud.io), descomenta y pon tu organizacion.
# (En el CI ya se pasa por linea de comandos via $SONAR_ORGANIZATION; esta linea es
#  para correrlo en local con: sonar-scanner -Dsonar.host.url=https://sonarcloud.io)
# sonar.organization=tu-organizacion
