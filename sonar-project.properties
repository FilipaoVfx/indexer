# Configuracion del analisis SonarQube para el monorepo x-bookmarks-indexer.
# El scanner busca este archivo en la raiz del repo.

sonar.projectKey=indexerdevops_indexerdevops
sonar.organization=indexerdevops
sonar.projectName=X Bookmarks Indexer
sonar.projectVersion=0.1.0

# Analiza todo el repo y excluye lo que no es codigo fuente nuestro.
sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.astro/**,\
  **/.git/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/package-lock.json,\
  **/*.zip,\
  web-astro/public/**,\
  sonarqube/**,\
  .scannerwork/**

# No hay tests ni cobertura configurados todavia. Cuando los agregues:
# sonar.tests=backend/test,web-astro/test
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- SonarCloud ---
# sonar.organization y sonar.projectKey (arriba) son identificadores PUBLICOS de
# SonarCloud, no secretos. El unico secreto es SONAR_TOKEN, que se define como
# variable protegida en GitLab (Settings > CI/CD > Variables), nunca en este archivo.
# El host (https://sonarcloud.io) lo pasa el job del CI por linea de comandos.
