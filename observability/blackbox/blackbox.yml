# Blackbox exporter modules.
# Used to probe the static frontend (GitHub Pages) from the outside:
# availability, latency, HTTP status and TLS certificate expiry.

modules:
  # Standard HTTPS probe: success on any 2xx, must use TLS, follows redirects
  # (GitHub Pages may redirect apex -> www or http -> https).
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
      follow_redirects: true
      fail_if_not_ssl: true
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false

  # Same as above but asserts a string is present in the body — handy to detect
  # "page loads but is broken/empty". Set fail_if_body_not_matches_regexp to a
  # marker that always appears in your built page (e.g. an app root id).
  http_2xx_body:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
      follow_redirects: true
      fail_if_not_ssl: true
      preferred_ip_protocol: "ip4"
      # fail_if_body_not_matches_regexp:
      #   - "<div id=\"app\""
