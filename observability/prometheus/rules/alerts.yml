# Alerting rules for the Indexer project.
# Thresholds are sensible defaults — tune them to your traffic and host size.

groups:
  # --- Indexer backend (RED + runtime) --------------------------------------
  - name: indexer-backend
    rules:
      - alert: BackendDown
        expr: up{job="indexer-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Indexer backend is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 2m (the /metrics endpoint is unreachable or the token is wrong)."

      - alert: BackendHighErrorRate
        expr: |
          sum(rate(indexer_http_requests_total{job="indexer-backend",status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(indexer_http_requests_total{job="indexer-backend"}[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backend 5xx error rate above 5%"
          description: "More than 5% of requests are failing with 5xx over the last 5m."

      - alert: BackendHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(indexer_http_request_duration_seconds_bucket{job="indexer-backend"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend p95 latency above 1s"
          description: "95th percentile request latency has been over 1s for 10m."

      - alert: BackendEventLoopLagHigh
        expr: indexer_nodejs_eventloop_lag_p99_seconds{job="indexer-backend"} > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node.js event-loop lag high"
          description: "p99 event-loop lag on {{ $labels.instance }} is above 200ms — the process is CPU/IO bound."

      - alert: BackendHighMemory
        # Default 512 MiB; adjust to your container/host memory limit.
        expr: indexer_process_resident_memory_bytes{job="indexer-backend"} > 536870912
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend RSS memory high"
          description: "Resident memory on {{ $labels.instance }} has exceeded 512 MiB for 10m."

  # --- VPS host (node_exporter) ---------------------------------------------
  - name: host
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host exporter down"
          description: "node_exporter on {{ $labels.instance }} is not reachable."

      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage above 85%"
          description: "CPU on {{ $labels.instance }} has been above 85% for 10m."

      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 90%"
          description: "Memory on {{ $labels.instance }} has been above 90% for 10m."

      - alert: HostLowDisk
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 < 10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Host disk space below 10%"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% free."

  # --- Frontend (blackbox_exporter probes) ----------------------------------
  - name: frontend
    rules:
      - alert: FrontendDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Frontend probe failing"
          description: "The probe to {{ $labels.instance }} has been failing for 3m (page unreachable, non-2xx, or TLS error)."

      - alert: FrontendSlow
        expr: probe_duration_seconds{job="blackbox-http"} > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Frontend slow to respond"
          description: "Total probe time for {{ $labels.instance }} has been above 3s for 10m."

      - alert: FrontendHttpNot2xx
        expr: probe_http_status_code{job="blackbox-http"} != 0 and (probe_http_status_code{job="blackbox-http"} < 200 or probe_http_status_code{job="blackbox-http"} >= 400)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frontend returning non-2xx/3xx status"
          description: "{{ $labels.instance }} returned HTTP {{ $value }} for 5m."

      - alert: FrontendSslCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 86400 * 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Frontend TLS certificate expiring soon"
          description: "Certificate for {{ $labels.instance }} expires in less than 14 days."

  # --- Supabase / Postgres ---------------------------------------------------
  - name: supabase
    rules:
      - alert: SupabaseScrapeDown
        expr: up{job="supabase"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Supabase metrics endpoint unreachable"
          description: "Prometheus cannot scrape the Supabase privileged metrics endpoint (check the service_role secret and project ref)."

      # Metric names from the Supabase endpoint can vary by project version.
      # Verify the exact name in Explore before enabling these.
      # - alert: PostgresHighConnections
      #   expr: |
      #     sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
      #   for: 5m
      #   labels:
      #     severity: warning
      #   annotations:
      #     summary: "Postgres connections above 80% of max"
      #     description: "Connection pool pressure on Supabase Postgres."
